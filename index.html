<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3f7">
<title>Selamat Ulang Tahun</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,900;1,400&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7fa;--pink:#f48fb1;--pd:#d9457a;--rose:#ffdbe7;--ink:#5a2a3c;--mute:#a27585;
--serif:'Playfair Display',Georgia,serif;--script:'Great Vibes',cursive;--sans:'Jost',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:400 16px/1.7 var(--sans);color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
background:radial-gradient(70% 40% at 10% 0%,#ffe1ec,transparent 70%),radial-gradient(60% 40% at 100% 55%,#ffe9f1,transparent 70%),radial-gradient(60% 40% at 0% 100%,#ffe1ec,transparent 70%),var(--bg)}
body.lock{overflow:hidden;height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.script{font-family:var(--script);font-weight:400}
.center{text-align:center}
.bt{position:fixed;z-index:99;pointer-events:none;animation:bt 1.5s ease-out forwards}
@keyframes bt{to{transform:translate(var(--dx),var(--dy)) rotate(40deg);opacity:0}}
.petal{position:fixed;top:-30px;z-index:0;pointer-events:none;animation:fall linear infinite;opacity:.65}
@keyframes fall{to{transform:translate(var(--sx),110vh) rotate(360deg)}}
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
.rv.in{opacity:1;transform:none}
section{position:relative;z-index:1;padding:90px 20px}
.wrap{max-width:640px;margin:0 auto}

/* intro */
#intro{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
background:radial-gradient(90% 60% at 50% 0%,#ffd3e2,transparent 70%),#fff7fa;transition:clip-path 1.1s cubic-bezier(.65,0,.35,1),opacity .6s .6s;clip-path:circle(150vmax at 50% 50%)}
#intro.go{clip-path:circle(0 at 50% 50%);opacity:0;pointer-events:none}
#intro h1{font:400 clamp(46px,13vw,84px)/1.1 var(--script);color:var(--pd);margin-bottom:28px;text-align:center}
.songs{display:flex;flex-direction:column;gap:12px;width:min(380px,100%)}
.song{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 18px;border-radius:18px;background:#fff;border:1px solid var(--rose);box-shadow:0 6px 18px rgba(244,143,177,.15);transition:.2s}
.song:hover,.song:active{transform:translateY(-3px);border-color:var(--pink)}
.song i{flex:none;width:38px;height:38px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px;padding-left:3px}
.song b{display:block;font-family:var(--serif);font-size:17px}.song small{color:var(--mute)}
#mp{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:41;display:none;align-items:center;gap:4px;padding:5px 6px 5px 14px;border-radius:99px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(217,69,122,.18);font-size:12px;color:var(--mute)}
#mp.on{display:flex}#mp b{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
#mp button{width:32px;height:32px;border-radius:50%;background:var(--rose);color:var(--pd)}

/* hero */
#hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.age{font:900 clamp(140px,36vw,260px)/.9 var(--serif);cursor:pointer;background:linear-gradient(160deg,#f7a8c4,var(--pd));-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 10px 30px rgba(217,69,122,.25));animation:beat 2.6s ease-in-out infinite;display:inline-block}
@keyframes beat{50%{transform:scale(1.04)}}
.hbd{font:italic 400 clamp(30px,7vw,54px) var(--serif)}
.name{font-size:clamp(54px,14vw,100px);color:var(--pd);line-height:1.2}
.words{max-width:500px;margin:14px auto 0;color:var(--mute);white-space:pre-line}
.chev{width:16px;height:16px;border:solid var(--pink);border-width:0 3px 3px 0;transform:rotate(45deg);margin-top:40px;animation:chv 1.8s ease-in-out infinite}
@keyframes chv{50%{transform:translateY(10px) rotate(45deg);opacity:.4}}

/* foto */
#tb{position:relative;width:min(1100px,100%);height:clamp(720px,130vw,1000px);margin:0 auto;border-radius:32px;overflow:hidden;
background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.7),rgba(255,219,231,.45));box-shadow:inset 0 0 0 1px var(--rose)}
.ph{position:absolute;left:0;top:0;padding:8px;background:#fff;border-radius:10px;box-shadow:0 8px 22px rgba(150,60,90,.22);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform}
.ph img,.ph video{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:5px;pointer-events:none;background:var(--rose)}
.ph.drag{box-shadow:0 24px 46px rgba(217,69,122,.42);cursor:grabbing}
#lb{position:fixed;inset:0;z-index:90;background:rgba(90,42,60,.78);display:none;align-items:center;justify-content:center;padding:20px;cursor:pointer}
#lb.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
#lb img,#lb video{max-width:min(560px,92vw);max-height:80vh;border:10px solid #fff;border-radius:12px;animation:zoom .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes zoom{from{transform:scale(.5) rotate(-6deg);opacity:0}}

/* kue */
.wcard{width:min(420px,100%);margin:0 auto 18px;padding:12px 12px 12px 22px;border-radius:99px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border:1px solid var(--rose);box-shadow:0 10px 28px rgba(217,69,122,.14);transition:.4s}
.wcard form{display:flex;gap:10px;align-items:center}
.wcard input{flex:1;min-width:0;border:0;outline:0;background:none;font:italic 400 18px var(--serif);color:var(--ink)}
.wcard input::placeholder{color:#d3a3b4}
.wcard button{flex:none;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--pd));color:#fff;font-size:20px;box-shadow:0 6px 16px rgba(217,69,122,.35)}
#wt{display:none;text-align:center;font:italic 400 19px/1.5 var(--serif);color:var(--pd);padding:6px 10px}
.wcard.done{background:linear-gradient(135deg,#fffdf4,#fff0d0);border-color:#f4dba6;border-radius:24px}
.wcard.done form{display:none}.wcard.done #wt{display:block;animation:zoom .6s}
.wcard.pulse{animation:pls .55s 2}
@keyframes pls{50%{box-shadow:0 0 0 9px rgba(244,143,177,.35);transform:scale(1.04)}}
.scene{width:min(520px,100%);margin:0 auto;display:block;overflow:visible}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate;transition:transform .35s,opacity .35s}
.fl.b{animation-duration:.43s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.1) rotate(3deg)}}
.fl.off{animation:none;transform:scale(0);opacity:0}
.smoke{opacity:0}.smoke.on{animation:sm 2.2s ease-out forwards}
@keyframes sm{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
#girl{cursor:pointer;animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-5px) rotate(-1.2deg)}}
#girl.no{animation:no .5s}
@keyframes no{25%{transform:translateX(-9px) rotate(-4deg)}75%{transform:translateX(9px) rotate(4deg)}}
#girl.ready{animation:bob 1.6s ease-in-out infinite,glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 2px rgba(244,143,177,.2))}to{filter:drop-shadow(0 0 14px rgba(244,143,177,.95))}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#mO{display:none}.blow #mO{display:block}.blow #mS{display:none}
.puff{opacity:0}.blow .puff{animation:puff 1s ease-out forwards;animation-delay:var(--pd)}
@keyframes puff{0%{opacity:.9;transform:translateX(0) scale(.5)}100%{opacity:0;transform:translateX(-170px) scale(1.6)}}
#cap{text-align:center;min-height:62px;margin-top:6px;font:italic 400 21px/1.5 var(--serif);color:var(--pd)}
#relight{font-size:26px;display:none;margin:0 auto}

/* taman & surat */
#garden{max-width:580px;margin:0 auto}
#garden svg{display:block;width:100%;height:auto;overflow:visible}
.cd{animation:drift 30s ease-in-out infinite alternate;filter:drop-shadow(0 5px 9px rgba(217,69,122,.2))}
@keyframes drift{to{transform:translateX(28px)}}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
#gg{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3s ease-in-out infinite}
#gg.hop{animation:hop .5s ease-out 3}
@keyframes hop{50%{transform:translateY(-26px)}}
.wv{transform-box:fill-box;transform-origin:50% 0%;animation:wave 1s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-132deg)}to{transform:rotate(-166deg)}}
.wg{transform-box:fill-box;transform-origin:50% 100%;animation:flap .28s ease-in-out infinite alternate}
@keyframes flap{from{transform:rotate(-22deg)}to{transform:rotate(16deg) scaleY(.6)}}
.sw{transform-box:fill-box;transform-origin:50% 0%;animation:swg 1.3s ease-in-out infinite alternate}
@keyframes swg{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.tw{transform-box:fill-box;transform-origin:center;animation:twk 1s ease-in-out infinite alternate}
@keyframes twk{from{transform:scale(.4);opacity:.4}to{transform:scale(1.2);opacity:1}}
.sheet{transform-box:fill-box;transform-origin:50% 100%;animation:ppop .9s cubic-bezier(.34,1.56,.64,1) backwards,pfl 2.6s ease-in-out .9s infinite}
@keyframes ppop{from{transform:scale(0) translateY(-60px) rotate(-30deg);opacity:0}}
@keyframes pfl{50%{transform:translateY(-6px)}}
.gl{animation:gls 1.5s ease-in-out infinite alternate}
@keyframes gls{from{opacity:.35}to{opacity:1}}
html.ns{overflow:hidden}
#lt{position:fixed;inset:0;z-index:95;display:none;overflow-y:auto;background:rgba(90,42,60,.55);backdrop-filter:blur(6px);padding:calc(30px + env(safe-area-inset-top)) 16px 40px}
#lt.on{display:flex;animation:fade .4s}
.lp{position:relative;margin:auto;width:min(560px,100%);padding:clamp(40px,8vw,58px) clamp(24px,6vw,48px) clamp(30px,6vw,44px);border-radius:18px;color:#4a2a2f;
background:repeating-linear-gradient(transparent 0 33px,rgba(217,69,122,.08) 33px 34px),linear-gradient(175deg,#fffdf8,#fff3e4);box-shadow:0 40px 90px rgba(90,42,60,.5);transform-origin:50% 100%;animation:unf 1s cubic-bezier(.22,1,.36,1)}
@keyframes unf{from{opacity:0;transform:translateY(70px) scale(.5)}}
.lp h3{font:400 clamp(38px,9vw,52px)/1.2 var(--script);color:var(--pd);text-align:center}
#ltB p{font:italic 400 clamp(16px,3.9vw,18.5px)/1.9 var(--serif);margin-top:14px;opacity:0;animation:show .9s forwards}
#ltS:empty{display:none}
#ltS{margin-top:26px;text-align:right;font:400 34px var(--script);color:var(--pd);opacity:0;animation:show 1s forwards}
@keyframes show{to{opacity:1}}
#ltX{position:absolute;top:10px;right:14px;width:38px;height:38px;border-radius:50%;font-size:26px;color:var(--mute)}

/* botol */
#jar{display:block;margin:0 auto;width:210px;cursor:pointer;animation:wig 5s ease-in-out infinite;filter:drop-shadow(0 14px 22px rgba(217,69,122,.2))}
@keyframes wig{0%,84%,100%{transform:none}88%{transform:rotate(-6deg)}92%{transform:rotate(6deg)}96%{transform:rotate(-3deg)}}
#jar.shake{animation:shk .5s ease-in-out 3}
@keyframes shk{0%,100%{transform:rotate(0)}20%{transform:rotate(-13deg) translateX(-7px)}40%{transform:rotate(12deg) translateX(7px)}60%{transform:rotate(-10deg)}80%{transform:rotate(9deg)}}
.pp{transform-box:fill-box;transform-origin:center}.shake .pp{animation:jig .22s linear infinite alternate}
@keyframes jig{from{transform:translateY(-7px) rotate(-14deg)}to{transform:translateY(7px) rotate(14deg)}}
#doa{display:none;max-width:440px;margin:26px auto 0;padding:28px 26px;border-radius:20px;background:linear-gradient(175deg,#fffdf6,#fff1d6);border:1px solid #f4dba6;box-shadow:0 14px 32px rgba(201,149,58,.2);text-align:center;font:italic 400 clamp(18px,4.4vw,21px)/1.7 var(--serif)}
#doa.on{display:block;animation:zoom .7s cubic-bezier(.34,1.56,.64,1)}
</style>
</head>

<script>
/* ═══ EDIT BAGIAN INI SAJA ═══ */
const C={

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const au=$('#au');let cur=0,live=false;

/* kelopak jatuh */
for(let i=0;i<16;i++){const p=document.createElement('div');p.className='petal';p.textContent=['🌸','💗','🌷','✨'][i%4];

/* intro: pilih lagu */

b.onclick=()=>{load(i);$('#intro').classList.add('go');document.body.classList.remove('lock');scrollTo(0,0);live=true;$('#mp').classList.add('on');
setTimeout(()=>{burst(innerWidth/2,innerHeight/2,28);$$('#hero .rv').forEach((e,k)=>setTimeout(()=>e.classList.add('in'),k*220))},500)};$('#songs').appendChild(b)});
au.onended=()=>load((cur+1)%C.songs.length);

/* hero */
$('#nm').textContent=C.name;$('#words').textContent=C.words;

/* reveal saat scroll */

$$('.rv').forEach(e=>io.observe(e));

/* ═══ FOTO: seret, lempar, pantul ═══ */
const tb=$('#tb'),cards=[],isV=s=>/\.(mp4|webm|mov)$/i.test(s);let W=0,H=0,cw=160,z=1,vis=false,run=false,started=false;
function size(){W=tb.clientWidth;H=tb.clientHeight;cw=Math.round(Math.min(200,W*.36))}
size();
function openLb(src){const lb=$('#lb');lb.innerHTML=isV(src)?`<video src="${src}" autoplay loop muted controls playsinline></video>`:`<img src="${src}" alt="">`;lb.classList.add('on')}
$('#lb').onclick=e=>{if(e.target.tagName==='VIDEO')return;$('#lb').classList.remove('on');$('#lb').innerHTML=''};
C.media.forEach((src,i)=>{const d=document.createElement('div');d.className='ph';
d.innerHTML=isV(src)?`<video src="${src}" muted loop playsinline autoplay preload="metadata"></video>`:`<img src="${src}" alt="" draggable="false">`;tb.appendChild(d);
const c={d,x:0,y:H+40,vx:0,vy:0,r:0,base:(Math.random()-.5)*18,s:1,dr:false,go:false,in:false,t:0,tt:0,mv:0,ox:0,oy:0,lx:0,ly:0,lt:0};cards.push(c);
d.addEventListener('pointerdown',e=>{const r=tb.getBoundingClientRect();d.setPointerCapture(e.pointerId);c.dr=true;c.go=true;c.in=true;c.mv=0;c.ox=e.clientX-r.left-c.x;c.oy=e.clientY-r.top-c.y;
c.lx=e.clientX;c.ly=e.clientY;c.lt=performance.now();c.vx=c.vy=0;d.style.zIndex=++z;d.classList.add('drag');e.preventDefault()});
d.addEventListener('pointermove',e=>{if(!c.dr)return;const r=tb.getBoundingClientRect(),now=performance.now(),dx=e.clientX-c.lx,dy=e.clientY-c.ly;
c.x=e.clientX-r.left-c.ox;c.y=e.clientY-r.top-c.oy;c.mv+=Math.abs(dx)+Math.abs(dy);c.vx=c.vx*.4+dx*.6;c.vy=c.vy*.4+dy*.6;
if(now-c.tt>80){c.tt=now;burst(e.clientX,e.clientY,1,['✨','💗'])}c.lx=e.clientX;c.ly=e.clientY;c.lt=now});
const up=e=>{if(!c.dr)return;c.dr=false;d.classList.remove('drag');
if(c.mv<7){c.vx=c.vy=0;openLb(src);burst(e.clientX,e.clientY,10)}
else{if(performance.now()-c.lt>90)c.vx=c.vy=0;c.vx=Math.max(-42,Math.min(42,c.vx));c.vy=Math.max(-42,Math.min(42,c.vy))}};
d.addEventListener('pointerup',up);d.addEventListener('pointercancel',up)});
function layout(){cards.forEach(c=>c.d.style.width=cw+'px')}layout();
function tick(now){
  if(!vis){run=false;return}
  for(const c of cards){
    if(!c.go&&now>=c.t){c.go=true;c.x=Math.random()*(W-cw);c.vy=-(20+Math.random()*14);c.vx=(Math.random()-.5)*12}
    if(c.go&&!c.dr){c.x+=c.vx;c.y+=c.vy;c.vx*=.964;c.vy*=.964;if(Math.abs(c.vx)<.02)c.vx=0;if(Math.abs(c.vy)<.02)c.vy=0;
      if(!c.in&&c.y<H-cw)c.in=true;
      if(c.x<0){c.x=0;c.vx=-c.vx*.6}else if(c.x>W-cw){c.x=W-cw;c.vx=-c.vx*.6}
      if(c.y<0){c.y=0;c.vy=-c.vy*.6}else if(c.in&&c.y>H-cw){c.y=H-cw;c.vy=-c.vy*.6}}
    c.r+=(c.base+Math.max(-28,Math.min(28,c.vx*2.4))-c.r)*.12;c.s+=((c.dr?1.1:1)-c.s)*.2;
    c.d.style.transform=`translate3d(${c.x}px,${c.y}px,0) rotate(${c.r}deg) scale(${c.s})`}
  requestAnimationFrame(tick)}
new IntersectionObserver(es=>{vis=es[0].isIntersecting;if(vis){if(!started){started=true;const n=performance.now();cards.forEach((c,i)=>c.t=n+i*130)}
if(!run){run=true;requestAnimationFrame(tick)}}},{threshold:.2}).observe(tb);
addEventListener('resize',()=>{size();layout();cards.forEach(c=>{c.x=Math.min(c.x,Math.max(0,W-cw));if(c.in)c.y=Math.min(c.y,Math.max(0,H-cw))})});

/* ═══ TAMAN: burung, botol, surat ═══ */
const NS='http://www.w3.org/2000/svg',gs=$('#gs'),bird=$('#bird'),fx=$('#fx'),GY=486;
$('#flw').innerHTML=Array.from({length:24},(_,i)=>{const x=70+Math.random()*290,y=474+Math.random()*24,c=['#ff8fb5','#fff','#ffd24a','#c3a6ff','#ff9eb8'][i%5],s=.7+Math.random()*.6;
return `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) scale(${s.toFixed(2)})"><g class="fw" style="animation-delay:${(-Math.random()*3).toFixed(1)}s"><path d="M0 0v-18" stroke="#5aa86a" stroke-width="2.5"/><circle cx="-5" cy="-21" r="4.5" fill="${c}"/><circle cx="5" cy="-21" r="4.5" fill="${c}"/><circle cx="0" cy="-26" r="4.5" fill="${c}"/><circle cx="0" cy="-17" r="4.5" fill="${c}"/><circle cx="0" cy="-21.5" r="3" fill="#ffe27a"/></g></g>`}).join('');
let ang=Math.PI*1.2,mode='fly',bx=0,by=0,bs=1,fall=null,shards=[],gvis=false,grun=false;
function toClient(x,y){const r=gs.getBoundingClientRect();return[r.left+x/420*r.width,r.top+y/520*r.height]}
function gtick(){
  if(!gvis){grun=false;return}
  if(mode==='fly'){ang+=.011;const sn=Math.sin(ang),cs=Math.cos(ang);bx=250+120*cs;by=118+52*sn;bs=.8+.2*(sn+1)/2;const dir=sn<0?1:-1;
    const tilt=Math.atan2(52*cs,Math.abs(120*sn)+.5)*57.3*.45;bird.setAttribute('transform',`translate(${bx.toFixed(1)} ${by.toFixed(1)}) scale(${(dir*bs).toFixed(3)} ${bs.toFixed(3)}) rotate(${tilt.toFixed(1)})`)}
  else if(mode==='leave'){bx+=3;by-=1.5;bird.setAttribute('transform',`translate(${bx} ${by}) scale(${bs} ${bs}) rotate(-12)`);if(bx>480){mode='gone';bird.style.display='none'}}
  if(fall){fall.vy+=.4;fall.y+=fall.vy;fall.r+=fall.vr;fall.g.setAttribute('transform',`translate(${fall.x} ${fall.y}) scale(${fall.s}) rotate(${fall.r})`);
    if(fall.y>=GY-16*fall.s){shatter(fall.x);fall.g.remove();fall=null}}
  for(const s of shards){s.vy+=.45;s.x+=s.vx;s.y+=s.vy;s.r+=s.vr;if(s.y>GY){s.y=GY;s.vy*=-.3;s.vx*=.6;s.vr*=.5}s.life-=1/110;
    s.el.setAttribute('transform',`translate(${s.x} ${s.y}) rotate(${s.r})`);s.el.setAttribute('opacity',Math.max(0,Math.min(1,s.life*1.6)))}
  shards=shards.filter(s=>{if(s.life<=0){s.el.remove();return false}return true});
  requestAnimationFrame(gtick)}
new IntersectionObserver(es=>{gvis=es[0].isIntersecting;if(gvis&&!grun){grun=true;requestAnimationFrame(gtick)}},{threshold:.05}).observe($('#garden'));
bird.addEventListener('click',()=>{if(mode!=='fly')return;mode='leave';
  const b=$('#bottle'),g=b.cloneNode(true);g.removeAttribute('id');const sw=g.querySelector('.sw');if(sw)sw.classList.remove('sw');const st=g.querySelector('.st');if(st)st.remove();
  fx.appendChild(g);b.style.display='none';fall={g,x:bx,y:by+44*bs,vy:-4,r:0,vr:(Math.random()<.5?-1:1)*3,s:bs};});
function shatter(x){
  for(let i=0;i<18;i++){const p=document.createElementNS(NS,'polygon'),k=3+Math.random()*7;
    p.setAttribute('points',`0,${-k} ${k*.9},${k*.6} ${-k*.8},${k*.5}`);p.setAttribute('fill',['#bfe6ff','#e6f6ff','#9fd3f2'][i%3]);p.setAttribute('stroke','#fff');p.setAttribute('stroke-width','.8');fx.appendChild(p);
    shards.push({el:p,x,y:GY-8,vx:(Math.random()-.5)*10,vy:-3-Math.random()*7,r:Math.random()*360,vr:(Math.random()-.5)*20,life:1})}
  const[cx,cy]=toClient(x,GY-10);burst(cx,cy,22,['✨','💎','💗']);
  const gg=$('#gg');gg.classList.add('hop');setTimeout(()=>gg.classList.remove('hop'),1600);
  const px=Math.max(150,Math.min(350,x));
  setTimeout(()=>{const p=$('#paper');p.setAttribute('transform',`translate(${px} ${GY+2})`);p.style.display='block'},900)}
function openLetter(){$('#ltH').textContent=C.letterTitle;const B=$('#ltB');B.innerHTML='';
  C.letter.forEach((t,i)=>{const p=document.createElement('p');p.textContent=t;p.style.animationDelay=(.8+i*.9)+'s';B.appendChild(p)});
  const S=$('#ltS');S.textContent=C.letterSign;S.style.animationDelay=(.8+C.letter.length*.9)+'s';

/* ═══ KUE: make a wish dulu, baru tiup lilin ═══ */
let wished=false,blown=false;
$('#wform').onsubmit=e=>{e.preventDefault();const v=$('#wish').value.trim();if(!v){$('#wish').focus();return}
wished=true;$('#wt').textContent='“'+v+'”';$('#wcard').classList.add('done');$('#girl').classList.add('ready');
const r=$('#wcard').getBoundingClientRect();burst(r.left+r.width/2,r.top+20,26,['⭐','🌠','✨','💫'])};
$('#girl').onclick=()=>{
  if(!wished){const g=$('#girl'),w=$('#wcard');g.classList.remove('no');g.getBoundingClientRect();g.classList.add('no');w.classList.remove('pulse');w.getBoundingClientRect();w.classList.add('pulse');$('#wish').focus({preventScroll:true});return}
  if(blown)return;blown=true;const sc=$('#scene');$('#girl').classList.remove('ready');sc.classList.add('blow');$('#cap').textContent='Fuuuh… 💨';
  setTimeout(()=>$('#f1').classList.add('off'),550);setTimeout(()=>$('#f2').classList.add('off'),750);
  setTimeout(()=>{$('#s1').classList.add('on');$('#s2').classList.add('on');sc.classList.remove('blow');
    $('#cap').textContent='Selamat ulang tahun yang ke-21! Semoga permintaanmu terkabul 🎉';
    const r=sc.getBoundingClientRect();burst(r.left+r.width*.35,r.top+r.height*.3,46,['🎉','💗','✨','🎈','🌸','🌠']);$('#relight').style.display='block'},1050)};
$('#relight').onclick=()=>{blown=false;wished=false;['#f1','#f2'].forEach(s=>$(s).classList.remove('off'));['#s1','#s2'].forEach(s=>$(s).classList.remove('on'));
$('#cap').textContent='';$('#relight').style.display='none';$('#wcard').classList.remove('done');$('#wish').value=''};

/* ═══ BOTOL HARAPAN: 10 afirmasi acak ═══ */
const cols=['#f48fb1','#ffd24a','#a8d8ff','#c3a6ff','#ffb199','#9fe3c0'];
$('#papers').innerHTML=Array.from({length:10},(_,i)=>{const x=40+(i%4)*27+Math.random()*6,y=146+Math.floor(i/4)*28+Math.random()*5;
return `<rect class="pp" x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="30" height="14" rx="4" fill="${cols[i%6]}" transform="rotate(${(Math.random()*70-35).toFixed(0)} ${x+15} ${y+7})"/>`}).join('');
let bag=[],busy=false,lastA='';
function nextAff(){if(!bag.length){bag=C.affirm.slice().sort(()=>Math.random()-.5);if(bag[bag.length-1]===lastA&&bag.length>1){const t=bag[0];bag[0]=bag[bag.length-1];bag[bag.length-1]=t}}lastA=bag.pop();return lastA}
$('#jar').onclick=()=>{if(busy)return;busy=true;const j=$('#jar'),d=$('#doa');j.classList.add('shake');d.classList.remove('on');
setTimeout(()=>{j.classList.remove('shake');d.textContent=nextAff();d.classList.add('on');const r=j.getBoundingClientRect();burst(r.left+r.width/2,r.top+40,24,['💌','✨','💖']);busy=false},1550)};
</script>
